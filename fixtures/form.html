<!doctype html><html lang="zh"><meta charset="utf-8"><title>ApplyOnce 虚构招聘表单</title><style>body{font:16px system-ui;max-width:700px;margin:35px auto;background:#f5f8fa}fieldset{margin:20px 0;padding:20px;background:white}label{display:block;margin:12px 0}input,select,textarea{display:block;padding:8px;width:90%}button{padding:10px}</style><h1>虚构招聘表单 · 验收用</h1><p>所有信息为测试数据，不发送网络请求。</p><form onsubmit="event.preventDefault();document.getElementById('result').textContent='手动提交触发'">
<fieldset><legend>基本信息</legend><label>姓名<input required></label><label>邮箱<input type=email></label><label>手机号码<input type=tel></label><label>证件号码<input></label><label>性别<select><option value="">请选择</option><option>男</option><option>女</option></select></label><label>预估到岗时间<input type=date></label><label>已有内容<input value="请保留此值"></label></fieldset>
<section data-apply-section="education"><h2>教育背景</h2><fieldset data-apply-record="0"><label>学校名称<input></label><label>专业名称<input></label><label>学历<select><option value="">请选择</option><option>本科</option><option>硕士</option></select></label><label>入学日期<input type=month></label></fieldset><fieldset data-apply-record="1"><label>学校名称<input></label><label>专业名称<input></label><label>学历<input></label></fieldset></section>
<fieldset><legend>手动操作</legend><label class="sd-Select-container-test">自定义城市<input role=combobox placeholder="请选择城市"></label><label>附件<input type=file></label><label><input type=checkbox>我已阅读协议</label><button type=submit>最终提交（仅测试）</button></fieldset><p id="result"></p></form></html>
